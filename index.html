<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Annu Barman | PGDM, IMI Bhubaneswar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Portfolio of Annu Barman: financial analysis, market research and Excel-based data analysis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#1a1a1a; --muted:#666666; --line:#e8e8e8;
  --accent:#d62839; --accent-ink:#ffffff; --chip:#fdecee;
  --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#141012; --surface:#1e181a; --ink:#f5f0f1; --muted:#b5a8ab; --line:#33292c;
  --accent:#ff4d5e; --accent-ink:#141012; --chip:#2e1c20;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:17px}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}

/* nav */
header.nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:60px}
.nav .brand{font-family:var(--serif);font-weight:700;text-decoration:none;margin-right:auto}
.nav a.link{text-decoration:none;color:var(--muted);font-size:15px}
.nav a.link:hover,.nav a.link.on{color:var(--ink)}
.nav a.link.on{border-bottom:2px solid var(--accent)}
#theme{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:17px}
@media(max-width:700px){.nav a.link{display:none}}

/* hero */
.hero{padding:72px 0 48px}
.hero h1{font-family:var(--serif);font-size:clamp(40px,7vw,68px);line-height:1.05;margin:0 0 16px;letter-spacing:-.02em}
.role{color:var(--muted);margin:0 0 20px}
.hero p.sum{font-size:19px;margin:0 0 28px;max-width:52ch}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:11px 20px;border-radius:10px;text-decoration:none;font-weight:700;border:1px solid var(--ink);color:var(--ink);background:transparent;font-size:16px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{transform:translateY(-1px)}

/* sections */
section{padding:56px 0;border-top:1px solid var(--line)}
section h2.t{font-family:var(--serif);font-size:32px;margin:0 0 24px;letter-spacing:-.01em}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 16px;border-radius:999px;cursor:pointer;font:inherit;font-size:15px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.card button.head{all:unset;box-sizing:border-box;display:flex;width:100%;gap:16px;padding:18px 20px;cursor:pointer;align-items:flex-start}
.card button.head:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:12px}
.card .ttl{flex:1}
.card .ttl b{display:block;font-size:18px}
.card .ttl span{color:var(--muted);font-size:15px}
.card .when{color:var(--muted);font-size:14px;white-space:nowrap}
.card .chev{transition:transform .2s;color:var(--muted)}
.card.open .chev{transform:rotate(180deg)}
.card .body{display:none;padding:0 20px 18px}
.card.open .body{display:block}
.card ul{margin:0;padding-left:20px}
.card li{margin:6px 0}
.tag{display:inline-block;font-size:13px;background:var(--chip);border-radius:6px;padding:1px 8px;margin-right:6px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--chip);padding:8px 14px;border-radius:8px;font-size:15px}
.list{list-style:none;padding:0;margin:0}
.list li{padding:12px 0;border-bottom:1px solid var(--line)}
.list li small{display:block;color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.contact p{max-width:52ch}
footer{padding:32px 0;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar{transition:none}.btn:hover{transform:none}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <a class="link" href="#skills">Skills</a>
    <a class="link" href="#work">Experience</a>
    <a class="link" href="#learning">Education</a>
    <a class="link" href="#contact">Contact</a>
    <button id="theme" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
  </div>
</header>

<main id="top">
  <div class="hero"><div class="wrap">
    <div>
      <h1 id="name"></h1>
      <p class="role" id="role"></p>
      <p class="sum" id="summary"></p>
      <div class="btns" id="heroBtns"></div>
    </div>
  </div></div>

  <section id="skills"><div class="wrap two">
    <div><h2 class="t">Skills</h2><div class="chips" id="skillChips"></div></div>
    <div><h2 class="t">Certifications</h2><ul class="list" id="certs"></ul></div>
  </div></section>

  <section id="work"><div class="wrap">
    <h2 class="t">Experience</h2>
    <div class="filters" id="filters" role="group" aria-label="Filter experience"></div>
    <div id="cards"></div>
  </div></section>

  <section id="learning"><div class="wrap two">
    <div><h2 class="t">Education</h2><table><thead><tr><th>Course</th><th>Institution</th><th>Score</th><th>Year</th></tr></thead><tbody id="edu"></tbody></table></div>
    <div><h2 class="t">Beyond work</h2><ul class="list" id="extra"></ul></div>
  </div></section>

  <section id="contact"><div class="wrap contact">
    <h2 class="t">Get in touch</h2>
    <p id="contactText"></p>
    <div class="btns" id="contactBtns"></div>
  </div></section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<script>
/* ==========================================================
   EDIT ONLY THIS BLOCK TO UPDATE YOUR PORTFOLIO
   ========================================================== */
const DATA = {
  name: "Annu Barman",
  role: "PGDM, IMI Bhubaneswar (2026–2028)",
  summary: "Commerce graduate with experience in financial analysis, market research and Excel-based data analysis. Interested in financial markets and investment research.",
  email: "annu123.p26@imibh.edu.in",
  linkedin: "https://linkedin.com/in/annu-barman-28b33a22b",
  resumeFile: "resume.pdf",   // put your resume PDF in the repo with this name; set "" to hide button

  /* type: "Internship" | "Project" | "Leadership"  (used by the filter buttons) */
  experience: [
    { type: "Internship", title: "Sales & Marketing Intern", org: "Anant Solar", when: "Feb – May 2026",
      points: [
        "Analysed 200+ customer lead records using Excel, Pivot Tables and VLOOKUP/HLOOKUP to find sales and conversion trends.",
        "Managed 150+ leads and follow-ups, and prepared MIS reports for sales coordination and performance tracking.",
        "Compared 8+ solar companies on pricing, offerings and market positioning."
      ], tags: ["Excel", "MIS", "Sales analysis"] },
    { type: "Project", title: "Marketing & Content Intern", org: "SoraSignals", when: "Sep 2026 – ongoing",
      points: [
        "Researched cryptocurrency market topics and industry developments to create educational content.",
        "Turned financial and crypto concepts into clear content for the audience.",
        "Contributed to market research, content planning and communication supporting startup growth."
      ], tags: ["Research", "Content", "Crypto"] },
    { type: "Internship", title: "Finance Intern", org: "Central Coalfields Limited", when: "Jun – Jul 2024",
      points: [
        "Analysed four years of Sales Realisation trends across 7 coal categories in MS Excel.",
        "Found 35% growth in Clean Coal, 21% in Slurry and a 4% decline in Coking Raw Coal against the 2021 base.",
        "Recommended processing and value addition to address the Coking Raw Coal decline."
      ], tags: ["Excel", "Financial analysis"] },
    { type: "Leadership", title: "Junior Sports Committee", org: "IMI Bhubaneswar", when: "2026 – 2028",
      points: [
        "Organised a one-day inter-college sports competition with 50+ participants: planning, scheduling, participant data and on-ground execution.",
        "Co-organised Kalesh, a 2-day sports event across 6 sections and 5 games, handling participants, sponsors and stalls.",
        "Owned event execution and the final prize distribution, and anchored the ceremony."
      ], tags: ["Event management", "Leadership"] },
    { type: "Leadership", title: "Member, VISHLESHAN (The Analytics Club)", org: "IMI Bhubaneswar", when: "2026 – 2028",
      points: [
        "Selected through a competitive process to join the club, which applies data-driven decision making to real business problems."
      ], tags: ["Analytics"] }
  ],

  skills: ["Market Research", "Data Analysis", "Advanced Excel", "MIS Reporting", "Power BI", "Financial Modelling", "Pivot Tables", "VLOOKUP / HLOOKUP"],

  certifications: [
    { name: "Financial Modelling", by: "Coursera" },
    { name: "Bloomberg Terminal", by: "Google" },
    { name: "Data for Business Analytics", by: "Coursera" },
    { name: "Excel", by: "Coursera" },
    { name: "Effective Problem Solving and Decision Making", by: "Coursera" }
  ],

  education: [
    { course: "PGDM", school: "IMI Bhubaneswar", score: "Pursuing", year: "2028" },
    { course: "B.Com (e-commerce)", school: "Sarala Birla University, Ranchi", score: "81%", year: "2025" },
    { course: "Class XII (Commerce)", school: "Adarsh Vidya Mandir, Chas", score: "88%", year: "2021" },
    { course: "Class X", school: "Adarsh Vidya Mandir, Chas", score: "74%", year: "2019" }
  ],

  extra: [
    { name: "Union Budget 2024 quiz and debate", note: "Competed against 20+ students." },
    { name: "Painting competition (2026)", note: "Team of 4 creating themed artwork." }
  ],

  contactText: "Open to internships and projects in finance, research and analytics. Email is the quickest way to reach me."
};
/* ========================================================== */

const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, html = "") => { const e = document.createElement(tag); Object.assign(e, attrs); e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* header + hero */
document.title = DATA.name + " | Portfolio";
$("brand").textContent = DATA.name;
$("name").textContent = DATA.name;
$("role").textContent = DATA.role;
$("summary").textContent = DATA.summary;
$("heroBtns").append(
  el("a", { className: "btn primary", href: "#work" }, "See my work"),
  ...(DATA.resumeFile ? [el("a", { className: "btn", href: DATA.resumeFile, target: "_blank", rel: "noopener" }, "Resume (PDF)")] : [])
);

/* experience cards + filter */
const types = ["All", ...new Set(DATA.experience.map(e => e.type))];
let current = "All";
function drawCards() {
  const box = $("cards"); box.innerHTML = "";
  DATA.experience.filter(e => current === "All" || e.type === current).forEach((e, i) => {
    const card = el("div", { className: "card" + (i === 0 ? " open" : "") });
    card.innerHTML = `
      <button class="head" aria-expanded="${i === 0}">
        <span class="ttl"><b>${esc(e.title)}</b><span>${esc(e.org)}</span></span>
        <span class="when">${esc(e.when)}</span><span class="chev">▾</span>
      </button>
      <div class="body"><ul>${e.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      <p>${(e.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</p></div>`;
    const head = card.querySelector(".head");
    head.onclick = () => { const o = card.classList.toggle("open"); head.setAttribute("aria-expanded", o); };
    box.append(card);
  });
}
types.forEach(t => {
  const b = el("button", { className: "pill", type: "button" }, esc(t));
  b.setAttribute("aria-pressed", t === current);
  b.onclick = () => { current = t; [...$("filters").children].forEach(x => x.setAttribute("aria-pressed", x === b)); drawCards(); };
  $("filters").append(b);
});
drawCards();

/* simple lists */
DATA.skills.forEach(s => $("skillChips").append(el("span", { className: "chip" }, esc(s))));
DATA.certifications.forEach(c => $("certs").append(el("li", {}, `${esc(c.name)}<small>${esc(c.by)}</small>`)));
DATA.education.forEach(e => $("edu").append(el("tr", {}, `<td>${esc(e.course)}</td><td>${esc(e.school)}</td><td>${esc(e.score)}</td><td>${esc(e.year)}</td>`)));
DATA.extra.forEach(x => $("extra").append(el("li", {}, `${esc(x.name)}<small>${esc(x.note)}</small>`)));

/* contact */
$("contactText").textContent = DATA.contactText;
$("contactBtns").append(
  el("a", { className: "btn primary", href: "mailto:" + DATA.email }, "Email me"),
  el("a", { className: "btn", href: DATA.linkedin, target: "_blank", rel: "noopener" }, "LinkedIn")
);
$("foot").textContent = "© " + new Date().getFullYear() + " " + DATA.name;

/* theme toggle (remembers choice) */
const root = document.documentElement;
try { const s = localStorage.getItem("theme"); if (s) root.dataset.theme = s; } catch (e) {}
$("theme").onclick = () => {
  const dark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
};
if (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches) root.dataset.theme = "dark";

/* highlight nav link for current section */
const links = [...document.querySelectorAll("a.link")];
new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(l => l.classList.toggle("on", l.getAttribute("href") === "#" + e.target.id));
}), { rootMargin: "-40% 0px -55% 0px" }).observe && document.querySelectorAll("section").forEach(s =>
  new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(l => l.classList.toggle("on", l.getAttribute("href") === "#" + s.id));
  }), { rootMargin: "-40% 0px -55% 0px" }).observe(s));
</script>
</body>
</html>
